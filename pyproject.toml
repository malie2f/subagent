[project]
name = "mcp-hub"
version = "0.1.0"
description = "子智能体 — 本机多 CLI 派活与任务组（MCP 接入名 subagent）"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "anyio>=4.0.0",
    "anthropic>=0.39.0",
    "openai>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
mcp-hub = "mcp_hub.server:main"
mcp-hub-cli = "mcp_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_hub"]

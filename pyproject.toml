[project]
name = "mcp-hub"
version = "0.1.0"
description = "MCP Hub - 让多个 AI 编程工具（Claude Code / Codex / Kimi / OpenCode / MiniMax Code）通过统一协议互相调用、互相派活"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "anyio>=4.0.0",
    "anthropic>=0.39.0",
    "openai>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
mcp-hub = "mcp_hub.server:main"
mcp-hub-cli = "mcp_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_hub"]
